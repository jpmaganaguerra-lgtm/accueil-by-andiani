[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/_reports/**"]

# Ruta amigable: /reportes/montes-de-ame/ver → la Function que valida sesión
# y sirve el reporte real (ver netlify/functions/report.js). El id viaja como
# parte de la ruta hacia la función, no como query string — Netlify no
# garantiza la sustitución de placeholders dentro de un query string en el
# destino de un redirect, solo en la ruta.
[[redirects]]
  from = "/reportes/:id/ver"
  to = "/.netlify/functions/report/:id"
  status = 200
  force = true

# Nunca cachear el índice de artículos ni el HTML de cada artículo agresivamente,
# para que un artículo recién publicado aparezca sin que el navegador sirva
# una copia vieja desde caché.
[[headers]]
  for = "/content/insights.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/insights/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
