[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/_reports/**"]

# El acceso a cada reporte va directo del navegador a la Function
# (/.netlify/functions/report/<id>), sin pasar por un redirect intermedio —
# los redirects de Netlify no garantizan cómo le llega la ruta reescrita a
# la función, así que se evita esa capa por completo. Ver
# reportes/montes-de-ame/index.html y netlify/functions/report.js.

# Nunca cachear el índice de artículos ni el HTML de cada artículo agresivamente,
# para que un artículo recién publicado aparezca sin que el navegador sirva
# una copia vieja desde caché.
[[headers]]
  for = "/content/insights.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/insights/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
